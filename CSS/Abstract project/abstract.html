<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Abstract - A CSS learning project exploring modern web design and styling techniques">
    <title>Abstract</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        <h3 style="font-weight: normal; padding-left: 10px;">Abstract | Help Center</h3>
        <div class="buttons">
            <button type="submit" class="btn-outline">Submit a request</button>
            <button class="btn-primary">Sign in</button>
        </div>
    </header>
    <section class="searchBar">
        <h1 style="font-weight: normal; font-size: 40px;">How can we help?</h1>
        <div class="search">
            <input placeholder="Search">
            <i class="bi bi-arrow-right-short"></i>
        </div>
    </section>
</body>
</html>
