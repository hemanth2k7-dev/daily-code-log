<!DOCTYPE html>
<html>
<head>
    <title>EMC</title>
    <link rel="icon" href="emc.png">
</head>
<body>
    <center>
        <h1>Error Makes Clever Academy🚀</h1>
        <h3>Training | Tech News | Freshers Guide</h3>
        <p>Empowering young developers to level up their skills through training in software development technologies</p>
    </center>
    <hr>
    <center>
        <h2>Registration Form</h2>
        <form>
            <table>
                <tr>
                    <td>Name:</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Age:</td>
                    <td><input type="number"></td>
                </tr>
                <tr>
                    <td>Gender:</td>
                    <td><input type="radio" name="Gender">Male <input type="radio" name="Gender">Female</td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td><input type="email"></td>
                </tr>
                <tr>
                    <td>Select a Course:</td>
                    <td>
                        <select>
                            <option>Full Stack Development</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Upload your Resume</td>
                    <td><input type="file"></td>
                </tr>
                <tr>
                    <td><input type="reset"></td>
                    <td><input type="submit"></td>
                </tr>
            </table>
        </form>
        <hr>
        <h4>
            <a href="index.html">Home</a> |
            <a href="https://www.instagram.com/errormakesclever/?hl=en">Instagram</a> |
            <a href="https://www.youtube.com/@ErrorMakesClever">YouTube</a>
        </h4>
    </center>
    <hr>
</body>
</html>
